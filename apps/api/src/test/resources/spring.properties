# Each cached test context owns a Postgres container, 8 JobRunr workers and the ONNX model (~470 MB native).
# The default cache (32) kept ~17 alive at once and starved the 2-core / 7 GB CI runner until the job timed out.
# Evicted contexts are closed, which stops their container and frees that memory.
spring.test.context.cache.maxSize=4
