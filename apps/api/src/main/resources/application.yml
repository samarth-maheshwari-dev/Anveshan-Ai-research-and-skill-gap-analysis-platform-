spring:
  application:
    name: anveshan-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ANV_DB_URL:jdbc:postgresql://localhost:5432/anveshan}
    username: ${ANV_DB_USER:anveshan}
    password: ${ANV_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never              # Flyway creates SPRING_SESSION tables (TS-G3)
  security:
    oauth2:
      client:
        # Secrets come only from environment variables (never from this file).
        # "not-configured" keeps the app bootable without them; login then fails at the provider.
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: [openid, email, profile]
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            scope: [read:user, user:email]

springdoc:
  api-docs:
    enabled: ${ANV_API_DOCS:false}      # off in production; tests export target/openapi.json
  writer-with-order-by-keys: true       # stable output → stable generated TS types
  default-produces-media-type: application/json

logging:
  exception-conversion-word: "%maskedEx"   # masked stack traces (logback-spring.xml)

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 14d
      cookie:
        name: ANV_SESSION
        http-only: true
        secure: ${ANV_COOKIE_SECURE:false}  # true once served over HTTPS
        same-site: lax
        # Domain: host-only by default (localhost). For app.<domain> + api.<domain>,
        # set SERVER_SERVLET_SESSION_COOKIE_DOMAIN=<domain> and ANV_COOKIE_DOMAIN=<domain>.

anveshan:
  app-origin: ${ANV_APP_ORIGIN:http://localhost:3000}
  cookie-domain: ${ANV_COOKIE_DOMAIN:}
  cookie-secure: ${ANV_COOKIE_SECURE:false}
  github-api-base: https://api.github.com
  secrets:
    # Tink AES-256-GCM keyset for user API keys (TECHSPEC §6.2). Never put the keyset itself here.
    tink-keyset: ${ANV_TINK_KEYSET:}
    tink-keyset-file: ${ANV_TINK_KEYSET_FILE:}
    tink-ephemeral: ${ANV_TINK_EPHEMERAL:false}   # tests/CI only
  # BYOK provider presets (TECHSPEC §10.1). Data, not code: fix a URL/path/model here without a rebuild.
  #   test-model:       known-good model the key test tries first — skipped when the provider doesn't list it,
  #                     so a retired hint costs nothing (the ranked live list takes over)
  #   preferred-models: regexes, best first, that order the live model list (ModelRanking)
  providers:
    GEMINI:
      transport: OPENAI_COMPATIBLE
      base-url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      chat-path: chat/completions
      models-path: models
      json-mode: true
      test-model: gemini-2.5-flash
      preferred-models: ["^gemini-\\d+(\\.\\d+)?-flash$", "^gemini-\\d+(\\.\\d+)?-flash-lite$", "^gemini-flash-latest$", "^gemini-"]
    GROQ:
      transport: OPENAI_COMPATIBLE
      base-url: "https://api.groq.com/openai/v1/"
      chat-path: chat/completions
      models-path: models
      json-mode: true
      test-model: llama-3.3-70b-versatile
      preferred-models: ["^llama-\\d+(\\.\\d+)?-70b-versatile$", "versatile", "^llama-\\d+(\\.\\d+)?-8b-instant$", "instant", "llama", "gpt-oss"]
    OPENROUTER:
      transport: OPENAI_COMPATIBLE
      base-url: "https://openrouter.ai/api/v1/"
      chat-path: chat/completions
      models-path: models
      json-mode: true
      preferred-models: [":free$"]
    OPENAI:
      transport: OPENAI_COMPATIBLE
      base-url: "https://api.openai.com/v1/"
      chat-path: chat/completions
      models-path: models
      json-mode: true
      test-model: gpt-4.1-mini
      preferred-models: ["^gpt-4\\.1-mini$", "^gpt-4o-mini$", "^gpt-4\\.1-nano$", "mini"]
    ANTHROPIC:
      transport: ANTHROPIC
      base-url: "https://api.anthropic.com/v1/"
      chat-path: messages
      models-path: models
      json-mode: false
      preferred-models: ["haiku", "sonnet"]
    CUSTOM:     { transport: OPENAI_COMPATIBLE, chat-path: chat/completions, models-path: models, json-mode: false }
    TAVILY:     { transport: TAVILY, base-url: "https://api.tavily.com/", chat-path: search, json-mode: false }
  # How the key test and default routing order a provider's model list (ModelRanking).
  model-ranking:
    # ids that can't answer a chat request: embeddings, speech, images, video, safety classifiers, Responses-only …
    exclude: [embed, tts, audio, image, vision, veo, aqa, guard, moderation, whisper, transcri, realtime, "(^|[-_/.:])live([-_/.:]|$)", computer-use, robotics, learnlm, search, dall-e, sora, codex, babbage, davinci]
    # pre-release names rank after stable ones
    unstable: ["(^|[-_/.:])(preview|exp|experimental|beta|alpha)([-_/.:]|\\d|$)"]
  # A provider's live model list (A-FR-5) and the key test that uses it.
  models:
    cache-ttl: 1h           # the raw list is cached per connection this long (key decrypted only on a miss)
    test-candidates: 5      # a test without an explicit model tries at most this many models (busy free tiers: 503/429 on the newest)
  outbound:
    allow-loopback: false     # tests only — lets a local fake provider count as "public"
  embeddings:
    # multilingual-e5-small ONNX files; fetch with apps/api/scripts/fetch-model.sh
    model-dir: ${ANV_EMBEDDINGS_MODEL_DIR:${user.home}/.cache/anveshan/models/multilingual-e5-small}
    batch-size: 32
    threads: ${ANV_EMBEDDINGS_THREADS:2}

# Actuator lives on an internal port; only health is exposed (TECHSPEC §16.2).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
