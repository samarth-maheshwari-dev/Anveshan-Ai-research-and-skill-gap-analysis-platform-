spring:
  application:
    name: anveshan-api
  config:
    import: classpath:credibility.yml   # credibility rules are data (TECHSPEC §12.8)
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ANV_DB_URL:jdbc:postgresql://localhost:5432/anveshan}
    username: ${ANV_DB_USER:anveshan}
    password: ${ANV_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20   # TECHSPEC §7.1: room for 8 JobRunr workers + requests + SSE replays
  task:
    scheduling:
      pool:
        size: 2               # research sweep and SSE keep-alive don't wait for each other
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never              # Flyway creates SPRING_SESSION tables (TS-G3)
  security:
    oauth2:
      client:
        # Secrets come only from environment variables (never from this file).
        # "not-configured" keeps the app bootable without them; login then fails at the provider.
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: [openid, email, profile]
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            scope: [read:user, user:email]

springdoc:
  api-docs:
    enabled: ${ANV_API_DOCS:false}      # off in production; tests export target/openapi.json
  writer-with-order-by-keys: true       # stable output → stable generated TS types
  default-produces-media-type: application/json

logging:
  exception-conversion-word: "%maskedEx"   # masked stack traces (logback-spring.xml)

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 14d
      cookie:
        name: ANV_SESSION
        http-only: true
        secure: ${ANV_COOKIE_SECURE:false}  # true once served over HTTPS
        same-site: lax
        # Domain: host-only by default (localhost). For app.<domain> + api.<domain>,
        # set SERVER_SERVLET_SESSION_COOKIE_DOMAIN=<domain> and ANV_COOKIE_DOMAIN=<domain>.

anveshan:
  app-origin: ${ANV_APP_ORIGIN:http://localhost:3000}
  cookie-domain: ${ANV_COOKIE_DOMAIN:}
  cookie-secure: ${ANV_COOKIE_SECURE:false}
  github-api-base: https://api.github.com
  secrets:
    # Tink AES-256-GCM keyset for user API keys (TECHSPEC §6.2). Never put the keyset itself here.
    tink-keyset: ${ANV_TINK_KEYSET:}
    tink-keyset-file: ${ANV_TINK_KEYSET_FILE:}
    tink-ephemeral: ${ANV_TINK_EPHEMERAL:false}   # tests/CI only
  # BYOK provider presets (TECHSPEC §10.1). Data, not code: fix a URL/path/model here without a rebuild.
  #   test-model:       known-good model the key test tries first — skipped when the provider doesn't list it,
  #                     so a retired hint costs nothing (the ranked live list takes over)
  #   preferred-models: regexes, best first, that order the live model list (ModelRanking)
  providers:
    GEMINI:
      transport: OPENAI_COMPATIBLE
      base-url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      chat-path: chat/completions
      models-path: models
      json-mode: true
      test-model: gemini-2.5-flash
      preferred-models: ["^gemini-\\d+(\\.\\d+)?-flash$", "^gemini-\\d+(\\.\\d+)?-flash-lite$", "^gemini-flash-latest$", "^gemini-"]
    GROQ:
      transport: OPENAI_COMPATIBLE
      base-url: "https://api.groq.com/openai/v1/"
      chat-path: chat/completions
      models-path: models
      json-mode: true
      test-model: llama-3.3-70b-versatile
      preferred-models: ["^llama-\\d+(\\.\\d+)?-70b-versatile$", "versatile", "^llama-\\d+(\\.\\d+)?-8b-instant$", "instant", "llama", "gpt-oss"]
    OPENROUTER:
      transport: OPENAI_COMPATIBLE
      base-url: "https://openrouter.ai/api/v1/"
      chat-path: chat/completions
      models-path: models
      json-mode: true
      preferred-models: [":free$"]
    OPENAI:
      transport: OPENAI_COMPATIBLE
      base-url: "https://api.openai.com/v1/"
      chat-path: chat/completions
      models-path: models
      json-mode: true
      test-model: gpt-4.1-mini
      preferred-models: ["^gpt-4\\.1-mini$", "^gpt-4o-mini$", "^gpt-4\\.1-nano$", "mini"]
    ANTHROPIC:
      transport: ANTHROPIC
      base-url: "https://api.anthropic.com/v1/"
      chat-path: messages
      models-path: models
      json-mode: false
      preferred-models: ["haiku", "sonnet"]
    CUSTOM:     { transport: OPENAI_COMPATIBLE, chat-path: chat/completions, models-path: models, json-mode: false }
    TAVILY:     { transport: TAVILY, base-url: "https://api.tavily.com/", chat-path: search, json-mode: false }
  # How the key test and default routing order a provider's model list (ModelRanking).
  model-ranking:
    # ids that can't answer a chat request: embeddings, speech, images, video, safety classifiers, Responses-only …
    exclude: [embed, tts, audio, image, vision, veo, aqa, guard, moderation, whisper, transcri, realtime, "(^|[-_/.:])live([-_/.:]|$)", computer-use, robotics, learnlm, search, dall-e, sora, codex, babbage, davinci]
    # pre-release names rank after stable ones
    unstable: ["(^|[-_/.:])(preview|exp|experimental|beta|alpha)([-_/.:]|\\d|$)"]
  # A provider's live model list (A-FR-5) and the key test that uses it.
  models:
    cache-ttl: 1h           # the raw list is cached per connection this long (key decrypted only on a miss)
    test-candidates: 5      # a test without an explicit model tries at most this many models (busy free tiers: 503/429 on the newest)
  outbound:
    allow-loopback: false     # tests only — lets a local fake provider count as "public"
  embeddings:
    # multilingual-e5-small ONNX files; fetch with apps/api/scripts/fetch-model.sh
    model-dir: ${ANV_EMBEDDINGS_MODEL_DIR:${user.home}/.cache/anveshan/models/multilingual-e5-small}
    batch-size: 32
    threads: ${ANV_EMBEDDINGS_THREADS:2}
  # External search APIs (TECHSPEC §11). Platform keys are optional (keyless = lower limits) and come from env only.
  search:
    user-agent: "Anveshan/0.1 (open-source research tool)"   # no personal data
    contact-email: ${ANV_SEARCH_CONTACT_EMAIL:}   # optional polite-pool mailto for Crossref/OpenAlex; empty = not sent
    results-per-query: 10
    queries-per-adapter: 2      # the plan's 2 best queries per API: enough recall, half the requests
    cache-ttl: 1h
    retry-wait: 1s              # 5xx/429/network: 3 attempts, 1 s then 2 s
    adapter-timeout: 45s        # an API slower than this for one sub-question counts as failed
    apis:
      openalex:        { enabled: true, base-url: "https://api.openalex.org/", api-key: "${ANV_OPENALEX_KEY:}", limit-for-period: 5, limit-refresh-period: 1s, timeout: 10s, daily-budget: 10000 }
      semanticscholar: { enabled: true, base-url: "https://api.semanticscholar.org/", api-key: "${ANV_S2_KEY:}", limit-for-period: 1, limit-refresh-period: 1s, timeout: 10s, daily-budget: 0 }
      arxiv:           { enabled: true, base-url: "https://export.arxiv.org/", limit-for-period: 1, limit-refresh-period: 3s, timeout: 15s, daily-budget: 0 }
      crossref:        { enabled: true, base-url: "https://api.crossref.org/", limit-for-period: 3, limit-refresh-period: 1s, timeout: 10s, daily-budget: 0 }
      wikipedia:       { enabled: true, base-url: "https://en.wikipedia.org/", limit-for-period: 5, limit-refresh-period: 1s, timeout: 10s, daily-budget: 0 }
      github:          { enabled: true, base-url: "https://api.github.com/", api-key: "${ANV_GITHUB_TOKEN:}", limit-for-period: 10, limit-refresh-period: 1s, timeout: 10s, daily-budget: 0 }
      tavily:          { enabled: true, base-url: "", limit-for-period: 2, limit-refresh-period: 1s, timeout: 10s, daily-budget: 0 }   # the user's own key (byok); URL from the byok preset
      searxng:         { enabled: true, base-url: "${ANV_SEARXNG_URL:}", limit-for-period: 2, limit-refresh-period: 1s, timeout: 15s, daily-budget: 0 }   # empty = no instance → off
  # Fetch and clean (TECHSPEC §12.4). Credibility lists live in credibility.yml (imported above).
  fetch:
    min-text-chars: 200       # less readable text than this = paywall stub / empty shell → unavailable
    max-pdf-pages: 60
    parallel: 4               # pages fetched at once per sub-question
    robots-ttl: 1d
    extra-ports: []           # tests only (local fake site); production allows 80/443 only
  # Research run engine (TECHSPEC §12.2)
  research:
    max-attempts: 3           # a step that throws 3× is FAILED → run FAILED; "Retry" restarts it (E-FR-4)
    retry-backoff: 15s        # wait before attempt 2; attempt 3 waits 4× longer (60s) — busy free models (503) usually recover in 1–2 min
    stale-after: 10m          # a RUNNING step older than this is treated as crashed and re-queued (AC-E1)
    sweep-interval: 30s       # how often stale steps and due auto-resumes (AI limit reset) are checked
    sse-timeout: 30m          # the browser reconnects with Last-Event-ID after this
    sse-keep-alive: 15s       # comment line so proxies don't close idle SSE connections
    ai-limit-fallback: 60s    # pause this long when a provider's 429 says nothing about when it resets
    requeue-interval: 5m      # PENDING steps of active runs get a job again (duplicates are harmless: claim is atomic)
    plan-expiry: 7d           # D-FR-7: a plan untouched this long while waiting for approval is cancelled

# Background jobs: one JobRunr job per research step. JobRunr keeps its own jobrunr_* tables (SCHEMA S-10).
jobrunr:
  background-job-server:
    enabled: true
    worker-count: 8
    poll-interval-in-seconds: 5   # JobRunr's minimum; the 15 s default would add up to ~2 min of idle time per run
  dashboard:
    enabled: false            # never exposed; enable locally only (127.0.0.1) when debugging
  jobs:
    default-number-of-retries: 0   # our own retry policy (anveshan.research.max-attempts), not JobRunr's
  miscellaneous:
    allow-anonymous-data-usage: false   # no usage telemetry leaves the server

# Actuator lives on an internal port; only health is exposed (TECHSPEC §16.2).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
