# Credibility rules (TECHSPEC §12.8): data, not code. Imported by application.yml. Host lists match the host and its
# sub-domains ("spring.io" also covers "docs.spring.io"). Change a list here, never a rule in Java.
anveshan:
  credibility:
    official-docs:
      - docs.spring.io
      - developer.mozilla.org
      - docs.oracle.com
      - docs.python.org
      - learn.microsoft.com
      - docs.github.com
      - kubernetes.io
      - docs.docker.com
      - react.dev
      - nextjs.org
      - www.postgresql.org
      - docs.aws.amazon.com
      - cloud.google.com
      - developer.android.com
      - developer.apple.com
      - go.dev
      - doc.rust-lang.org
      - nodejs.org
      - typescriptlang.org
      - pytorch.org
      - tensorflow.org
      - scikit-learn.org
    government-suffixes:
      - .gov
      - .gov.in
      - .nic.in
      - .gov.uk
      - .europa.eu
      - .gc.ca
      - .gov.au
      - .edu
      - .ac.in
      - .ac.uk
    standards-bodies:
