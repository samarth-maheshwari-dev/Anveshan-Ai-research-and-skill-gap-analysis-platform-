name: api

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/lib/api/openapi.json"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/lib/api/openapi.json"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/anveshan/models
          key: e5-small-614241f
      - name: Fetch embedding model (verified by SHA-256)
        run: bash scripts/fetch-model.sh
      - name: Build and test (unit + integration)
        run: ./mvnw -B verify
      - name: Web copy of the OpenAPI spec is up to date (TECHSPEC §8.7)
        run: |
          if ! diff <(tr -d '\r' < target/openapi.json) <(tr -d '\r' < ../web/lib/api/openapi.json) > /dev/null; then
            echo "::error::apps/web/lib/api/openapi.json is stale — run: pnpm -C apps/web sync:api"; exit 1
          fi
      - name: Upload test reports (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            apps/api/target/surefire-reports/*.txt
            apps/api/target/failsafe-reports/*.txt
            apps/api/target/failsafe-reports/*-output.txt
          retention-days: 7
          if-no-files-found: ignore
