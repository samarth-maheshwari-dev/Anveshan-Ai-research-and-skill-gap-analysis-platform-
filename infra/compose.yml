# Anveshan local stack (zero-budget P02): Postgres + API + Web on one laptop.
# Based on TECHSPEC §16.2. SearXNG (free web search, internal only) since P11; Caddy/HTTPS, Prometheus, Grafana later.
#
#   cd infra
#   cp .env.example .env        # then set PG_PASSWORD
#   docker compose up -d --build --wait
#   bash smoke-test.sh
#
# Every published port is bound to 127.0.0.1 only — nothing is reachable from the network.

name: anveshan

services:
  postgres:
    image: pgvector/pgvector:0.8.4-pg17
    environment:
      POSTGRES_DB: anveshan
      POSTGRES_USER: anveshan
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in infra/.env}
    ports: ["127.0.0.1:5432:5432"]          # for running the API from the IDE; localhost only
    volumes:
      - pg_data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anveshan -d anveshan"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g

  api:
    build: ../apps/api
    image: anveshan-api:${API_TAG:-dev}
    env_file:
      # OAuth client ids/secrets (GOOGLE_CLIENT_ID=…, GITHUB_CLIENT_SECRET=…). Keep this file OUTSIDE
      # the repo; point OAUTH_ENV_FILE at it in infra/.env. Optional: without it login is disabled.
      - path: ${OAUTH_ENV_FILE:-./oauth.env}
        required: false
      # Optional platform search keys (ANV_OPENALEX_KEY, ANV_S2_KEY, ANV_GITHUB_TOKEN, ANV_SEARCH_CONTACT_EMAIL).
      # Without them the APIs run keyless at lower limits. Keep this file OUTSIDE the repo too.
      - path: ${SEARCH_ENV_FILE:-./search.env}
        required: false
    environment:
      ANV_APP_ORIGIN: http://localhost:3000
      ANV_DB_URL: jdbc:postgresql://postgres:5432/anveshan
      ANV_DB_USER: anveshan
      ANV_DB_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in infra/.env}
      ANV_TINK_KEYSET_FILE: /run/secrets/tink_keyset
      ANV_TINK_EPHEMERAL: ${ANV_TINK_EPHEMERAL:-false}   # true only in CI (throwaway key)
      ANV_SEARXNG_URL: http://searxng:8080/          # internal network only
    secrets: [tink_keyset]
    # loopback only, IPv4 and IPv6: Windows resolves "localhost" to ::1 first. 8081 (actuator) is NOT published
    ports: ["127.0.0.1:8080:8080", "[::1]:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      searxng: { condition: service_started }      # search works without it too (that API is then just missing)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2560m                      # ~1.25 GB heap + ONNX embedding model (native)

  web:
    build: ../apps/web
    image: anveshan-web:${WEB_TAG:-dev}
    ports: ["127.0.0.1:3000:3000", "[::1]:3000:3000"]   # loopback only, IPv4 + IPv6 ("localhost" → ::1 on Windows)
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m

  # Free fallback web search for users without a Tavily key (TECHSPEC §11.1). NOT published: only the API reaches it.
  searxng:
    image: searxng/searxng:2026.11.6-ac11e14c5
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-only-change-me}   # internal service; set your own in infra/.env
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    mem_limit: 256m

  # On-demand backup (TECHSPEC §16.7, local version):
  #   docker compose --profile backup run --rm backup
  backup:
    profiles: ["backup"]
    image: pgvector/pgvector:0.8.4-pg17     # same major version as the server → matching pg_dump
    environment:
      PGHOST: postgres
      PGUSER: anveshan
      PGDATABASE: anveshan
      PGPASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in infra/.env}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/run.sh:/run.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["bash", "/run.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

volumes:
  pg_data: {}

secrets:
  # Tink AES-256-GCM keyset that encrypts users' AI keys. Keep it OUTSIDE the repo and point
  # TINK_KEYSET_FILE at it in infra/.env. The committed placeholder is empty on purpose:
  # the API refuses to start with it unless ANV_TINK_EPHEMERAL=true (CI only).
  tink_keyset:
    file: ${TINK_KEYSET_FILE:-./tink-keyset.placeholder}
